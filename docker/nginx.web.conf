# Nginx config for the WorldEditor Next static Web SPA.
# Used by Dockerfile.web (copied to /etc/nginx/conf.d/default.conf).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME for streaming WASM compilation (WebAssembly.instantiateStreaming).
    types {
        application/wasm wasm;
    }

    # Compression for the large JS/WASM payloads.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/wasm
        application/json
        text/css
        image/svg+xml;

    # Lightweight health endpoint for cloud load balancers / orchestrators.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unmatched routes serve the app entry point.
    location / {
        # index.html must not be long-cached so new releases are picked up.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
