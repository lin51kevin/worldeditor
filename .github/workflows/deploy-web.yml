name: Deploy Web

# Build the complete Web artifact and package it into a Docker image pushed to
# GitHub Container Registry (GHCR). Triggered on version tags or manually.
#
#   Pipeline: build-artifact (dist/) → docker image → push to GHCR
#
# The published image serves the static SPA via Nginx and can be pulled onto any
# cloud server:  docker run -d -p 80:80 ghcr.io/<owner>/worldeditor-web:<tag>

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Lowercase image name is required by GHCR; repository owner is injected below.
  IMAGE_NAME: worldeditor-web

jobs:
  build-artifact:
    name: Build Web artifact
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn
        run: npm install -g yarn@1

      # One-click artifact build: FULL release WASM (+ wasm-opt) + static SPA.
      - name: Build Web artifact
        run: node scripts/build-web.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/
          if-no-files-found: error

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-22.04
    needs: [build-artifact]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Bring in the pre-built artifact so Dockerfile.web can COPY it.
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
